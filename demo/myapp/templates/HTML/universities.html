<!DOCTYPE html>
<html lang="ro">

<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universități</title>
    <link rel="stylesheet" href="{% static 'CSS/universities_style.css' %}">
    <link rel="stylesheet" href="{% static 'CSS/cursor.css' %}">
</head>

<body>
    <div>
        <h1>Universități din România</h1>
        <label for="q">Filtru (opțional):</label>
        <input id="q" placeholder="caută după nume..." />
        <button id="exportBtn">Export CSV</button>

        <div id="status" class="status"></div>

        <table>
            <thead>
                <tr>
                    <th>Nume</th>
                    <th>Țara</th>
                    <th>Site</th>
                </tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>
    </div>

    <script src="{% static 'JS/universities_js.js' %}"></script>
    <script src="{% static 'TS/cursor.js' %}"></script>
</body>

</html>
