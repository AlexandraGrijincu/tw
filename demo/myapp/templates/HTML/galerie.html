<!DOCTYPE html>
<html lang="ro">

<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerie Foto - Comunitatea TW</title>
    <link rel="stylesheet" href="{% static 'CSS/home_style.css' %}">
    <link rel="stylesheet" href="{% static 'CSS/galerie.css' %}">
    <link rel="stylesheet" href="{% static 'CSS/cursor.css' %}">
</head>

<body>
    <header>
        <div class="container">
            <h1>Comunitatea de Tehnologii Web 2026</h1>
            <nav>
                <a href="{% url 'home' %}">Acasă</a>
                <a href="{% url 'galerie' %}">Galerie</a>
                <a href="{% url 'universities' %}">Facultăți</a>
                <a href="{% url 'chatbot' %}">ChatBot</a>
                <a href="{% url 'login' %}">Logout</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <h2 style="color: white; margin-top: 30px;">Galeria Noastră</h2>

        <!-- Container principal pentru carusel -->
        <div class="carousel-container">
            <!-- Container pentru imaginea mare -->
            <div class="carousel-view">
                <!-- Imaginea curenta din carusel -->
                <img id="carousel-image" src="{% static 'MEDIA/i1.webp' %}" alt="Carusel">
                <img id="carousel-image" src="{% static 'MEDIA/i2.webp' %}" alt="Carusel">
                <img id="carousel-image" src="{% static 'MEDIA/i3.webp' %}" alt="Carusel">
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>© 2026 Comunitatea de Tehnologii Web</p>
            <p>
                <a href="https://www.uvt.ro" target="_blank">Universitatea de Vest din Timișoara</a> |
                <a href="https://www.info.uvt.ro" target="_blank">Facultatea de Informatică</a>
            </p>
        </div>
    </footer>

    <script src="{% static 'TS/cursor.js' %}"></script>
    <script src="{% static 'TS/galerie.js' %}"></script>
</body>

</html>
